org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Isolated Projects (incubating, Gradle 9.7+): configures each project in isolation, enabling
# parallel configuration and finer-grained configuration-cache invalidation. Supersets the
# configuration cache and configure-on-demand. The chipbox build, its convention plugins, and the
# sage/ submodule are all IP-clean; KSP needs the opt-in below. The only remaining cross-project
# access is apps/server's apps/js bundle reads, which are gated behind -Psage.js (off by default).
org.gradle.isolated-projects=true
# KSP's cross-target task-dependency wiring (nonSelfDeps) is Isolated-Projects-incompatible unless
# this opt-in is set. KSP only auto-enables it for the OLD `org.gradle.unsafe.isolated-projects`
# property, so with the promoted `org.gradle.isolated-projects` name above it must be set explicitly
# (KSP 2.4.0 turns it on by default). See google/ksp#1752.
ksp.project.isolation.enabled=true
# Configure only the projects in the task graph. The big win: CI's screenshot job stops
# configuring :cbox:android:player:emulators:*:native, whose externalNativeBuild { cmake { } }
# triggers an NDK auto-install during configuration even though the task graph never reaches
# those modules. Removes a multi-minute download from CI screenshot runs.
org.gradle.configureondemand=true

# Kotlin/JS compilation (KotlinJsIrTransformer) is heavier than JVM and OOMs the 1g default the
# Kotlin daemon ships with — bump to 3g to keep `compileTestDevelopmentExecutableKotlinJs`
# happy across feature modules. The daemon stays in process between tasks, so this is one-time.
kotlin.daemon.jvmargs=-Xmx4096m -XX:+UseParallelGC

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# AGP 9's built-in Kotlin disallows generated source sets contributing via
# kotlin.sourceSets DSL (KSP currently does this). Allow the legacy behaviour
# until KSP migrates to android.sourceSets.
android.disallowKotlinSourceSets=false

kotlin.code.style=official

# Inputs to SAGE's app-agnostic namespaceFromPath() (sage-build-logic). The chipbox convention
# plugins + plain sage.android/sage.kmp modules derive their `namespace` from the Gradle path:
# prefix everything with this package and drop the structural `cbox`/`android` path segments.
sage.namespace.prefix=net.sigmabeta.chipbox
sage.namespace.dropSegments=cbox,android

# sage.kmp modules wire jvmSharedMain explicitly (androidMain+jvmMain dependsOn it,
# it dependsOn commonMain) so src/main/java works without code moves. The Default
# Kotlin Hierarchy Template refuses to apply once custom dependsOn edges are added
# and warns about it once per module — disable the template to silence the noise.
kotlin.mpp.applyDefaultHierarchyTemplate=false
