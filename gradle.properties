org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# AGP 9's built-in Kotlin disallows generated source sets contributing via
# kotlin.sourceSets DSL (KSP currently does this). Allow the legacy behaviour
# until KSP migrates to android.sourceSets.
android.disallowKotlinSourceSets=false

kotlin.code.style=official

# Inputs to SAGE's app-agnostic namespaceFromPath() (sage-build-logic). The chipbox convention
# plugins + plain sage.android/sage.kmp modules derive their `namespace` from the Gradle path:
# prefix everything with this package and drop the structural `cbox`/`android` path segments.
sage.namespace.prefix=net.sigmabeta.chipbox
sage.namespace.dropSegments=cbox,android

# sage.kmp modules wire jvmSharedMain explicitly (androidMain+jvmMain dependsOn it,
# it dependsOn commonMain) so src/main/java works without code moves. The Default
# Kotlin Hierarchy Template refuses to apply once custom dependsOn edges are added
# and warns about it once per module — disable the template to silence the noise.
kotlin.mpp.applyDefaultHierarchyTemplate=false
