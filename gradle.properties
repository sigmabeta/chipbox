org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# AGP 9's built-in Kotlin disallows generated source sets contributing via
# kotlin.sourceSets DSL (KSP currently does this). Allow the legacy behaviour
# until KSP migrates to android.sourceSets.
android.disallowKotlinSourceSets=false

kotlin.code.style=official
