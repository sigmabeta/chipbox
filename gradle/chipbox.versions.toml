# Chipbox convention plugins (chipbox build-logic). Registered as the `chipbox` version catalog in
# settings.gradle.kts, so modules apply them via `alias(chipbox.plugins.<name>)`. Versionless —
# the plugins come from the included build, not a published artifact.
[plugins]
feature-api = { id = "chipbox.feature.api" }
feature-real = { id = "chipbox.feature.real" }
emulator-real = { id = "chipbox.emulator.real" }
emulator-native = { id = "chipbox.emulator.native" }
native-host = { id = "chipbox.native.host" }
screenshot = { id = "chipbox.screenshot" }
kmp-test = { id = "chipbox.kmp.test" }

# Published artifacts not carried by the sage submodule's `libs` catalog. Pure-JVM only — junrar
# decodes RAR 4.x archives (RSN sound-chip sets are solid RAR archives of SPC files); it has no
# Kotlin/Native or JS port, so it's wired into `jvmSharedMain` behind an expect/actual unrar().
[versions]
junrar = "7.5.5"

[libraries]
junrar = { module = "com.github.junrar:junrar", version.ref = "junrar" }
