name: CI

# Push / PR checks for every branch (the GitHub Actions replacement for the former CircleCI
# build_analyze workflow — see arch-docs/ci-actions-migration.md). Tag releases live in release.yml;
# native Windows installers and macOS are later phases.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Remote Gradle build cache (gradle.sebacloud.org): anonymous read always; push needs CI (Actions
  # sets it) + these. Absent (e.g. fork PRs) → read-only, build still works.
  GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
  GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint + detekt
        run: ./gradlew ktlintCheck detekt --continue --build-cache --no-configuration-cache --no-daemon --max-workers=2 -Pchipbox.skipNative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: '**/build/reports/**'

  shared-build:
    # Gate the heavy whole-graph compile behind ktlint + detekt: fail fast on a lint/style break
    # before spending a compile on it (mirrors the former CircleCI shared-build ← static-analysis edge).
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile shared JVM code
        run: ./gradlew :apps:jvm:classes --build-cache --no-configuration-cache --no-daemon --max-workers=4

  unit-test:
    # Behind static-analysis so a syntax/style break fails fast in the cheap job rather than burning
    # compile time here (mirrors the former CircleCI unit-test-jvm ← static-analysis edge).
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # jvmTest spins up Compose Desktop windows, so it needs an X display — same xvfb wrapper CI used.
      - name: jvmTest (commonTest JVM target)
        run: xvfb-run -a ./gradlew jvmTest --continue --build-cache --no-configuration-cache --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: '**/build/test-results/**/TEST-*.xml'

  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true # Paparazzi golden snapshots are the only LFS-tracked files
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Paparazzi snapshots
        run: ./gradlew verifyPaparazziDebug --continue --build-cache --no-configuration-cache --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paparazzi-diffs
          path: '**/build/paparazzi/**'

  android-lint:
    # Starts only once the shared code compiles: lintRelease compiles the release graph, whose Kotlin
    # compiles land in the remote build cache for android-apk to hit (mirrors CircleCI android-lint ←
    # shared-build). shared-build itself gates on static-analysis, so this never runs on lint-failing code.
    needs: shared-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android lint (release)
        run: ./gradlew :apps:android:lintRelease --build-cache --no-configuration-cache --no-daemon --max-workers=4 -Pchipbox.skipNative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: 'apps/android/build/reports/**'

  desktop-linux:
    # Behind shared-build so the shared Kotlin compiles are remote-cache hits here; this job then only
    # adds the host-native libs + the desktop app image (mirrors CircleCI build-release-jvm ← shared-build).
    needs: shared-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Builds the jpackage app image (host emulator natives via the image's gcc/g++/make + jlink
      # runtime) — the desktop packaging path after the move to compose.desktop.application. The
      # OS-specific installers (.deb/.rpm) are release-only; this just proves the app assembles.
      - name: Build desktop app image (Linux)
        run: ./gradlew :apps:jvm:createDistributable --build-cache --no-configuration-cache --no-daemon --max-workers=4

  android-apk:
    # Last in the chain: android-lint compiled the release graph into the remote build cache, so this
    # job's assembleRelease hits those Kotlin compiles and only adds the assemble-only work (dexing,
    # native build, APK packaging) — mirrors CircleCI build-release-apk ← android-lint.
    needs: android-lint
    runs-on: ubuntu-latest
    env:
      # Release signing — without these the APK is debug-signed (apps/android/build.gradle.kts).
      CHIPBOX_KEY_ALIAS: ${{ secrets.CHIPBOX_KEY_ALIAS }}
      CHIPBOX_KEYSTORE_PASSWORD: ${{ secrets.CHIPBOX_KEYSTORE_PASSWORD }}
      CHIPBOX_KEY_PASSWORD: ${{ secrets.CHIPBOX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history + tags for appVersioning's git describe
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Puts sdkmanager on PATH and accepts SDK licenses (it isn't on PATH by default on ubuntu-latest).
      - uses: android-actions/setup-android@v3
      # Cache the ~1GB NDK (+ CMake) so only the first run pays the download. Path is the stable
      # ubuntu-latest SDK location; a miss just re-installs.
      - name: Cache NDK + CMake
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/29.0.14206865
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-29.0.14206865-cmake-3.22.1
      # The Android emulator natives need the pinned NDK + an SDK CMake (NativeEmulators).
      - name: Install NDK + CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release (split APKs)
        run: ./gradlew :apps:android:assembleRelease -PdisablePreDex --build-cache --no-configuration-cache --no-daemon --max-workers=4
      - name: Name APKs by version + ABI
        run: ./scripts/rename-release-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: apps/android/build/outputs/apk/release/chipbox-*.apk
