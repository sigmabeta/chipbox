name: CI

# Push / PR checks for every branch (the GitHub Actions replacement for the former CircleCI
# build_analyze workflow — see arch-docs/ci-actions-migration.md). Tag releases live in release.yml;
# native Windows installers and macOS are later phases.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Remote Gradle build cache (gradle.sebacloud.org): anonymous read always; push needs CI (Actions
  # sets it) + these. Absent (e.g. fork PRs) → read-only, build still works.
  GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
  GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate the multi-arch Dockerfile + release wiring
        run: scripts/ci/verify-docker-release.sh
      - name: User-facing strings (no hardcoded ShowSnackbar literals)
        run: scripts/ci/check-user-facing-strings.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint + detekt
        run: ./gradlew ktlintCheck detekt --continue --build-cache --no-daemon --max-workers=2 -Pchipbox.skipNative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: '**/build/reports/**'

  web:
    # The browser app has its own toolchain: Kotlin/JS + webpack need Node/Yarn, the nine emulator
    # modules need a pinned Emscripten SDK, and the deployable artifact is the Docker image. Nothing
    # in the other jobs builds any of it, so a WASM/bundle/image break would otherwise only surface
    # in a release. The image is built for linux/amd64 and NOT pushed (no registry in v1).
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # node-version-file: docker/node-version is the same pin the Dockerfile installs.
      - uses: actions/setup-node@v4
        with:
          node-version-file: docker/node-version
          cache: yarn
          cache-dependency-path: kotlin-js-store/yarn.lock
      - name: Install pinned Yarn
        run: npm install -g "yarn@$(cat docker/yarn-version)"
      # emsdk is a ~1GB checkout; cache it keyed by the pin. Activate on every run so the
      # restored tree's .emscripten config matches the current $HOME/emsdk path.
      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('docker/emsdk-version') }}
      - name: Install Emscripten SDK
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/emsdk/upstream/emscripten/emcc" ]; then
            git clone --depth 1 --branch "$(cat docker/emsdk-version)" \
              https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
            "$HOME/emsdk/emsdk" install "$(cat docker/emsdk-version)"
          fi
          "$HOME/emsdk/emsdk" activate "$(cat docker/emsdk-version)"
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      # Isolated Projects is incompatible with the Kotlin/JS + webpack toolchain, and JS requires
      # configure-on-demand OFF; --no-parallel avoids the cross-project npm configuration lock.
      - name: Build WASM + web bundle + server distribution
        run: >-
          ./gradlew :apps:js:verifyWebBundle :apps:server:installDist
          -Psage.js=true -Pchipbox.skipNative
          -Dorg.gradle.isolated-projects=false -Dorg.gradle.configureondemand=false
          --no-parallel --build-cache --no-daemon --max-workers=4
      - name: Assert the bundle contains all nine emulator pairs
        run: scripts/ci/verify-web-bundle.sh
      - name: Server health/scan-state tests
        run: >-
          ./gradlew :apps:server:test -Pchipbox.skipNative
          --build-cache --no-daemon --max-workers=2
      - name: Shared JS-side tests (jsNodeTest)
        run: >-
          ./gradlew jsNodeTest
          -Psage.js=true -Pchipbox.skipNative
          -Dorg.gradle.isolated-projects=false -Dorg.gradle.configureondemand=false
          --no-parallel --build-cache --no-daemon --max-workers=4
      - name: Read the pinned toolchain (single source - docker/*-version)
        id: pins
        run: |
          set -euo pipefail
          {
            echo "node=$(cat docker/node-version)"
            echo "yarn=$(cat docker/yarn-version)"
            echo "emsdk=$(cat docker/emsdk-version)"
          } >> "$GITHUB_OUTPUT"
      # `.dockerignore` excludes `.git`, so the image can't run `git describe`; resolve the same
      # identity here and pass it as build args (the Dockerfile's deterministic inputs).
      - name: Resolve web build identity
        id: buildinfo
        run: |
          set -euo pipefail
          {
            echo "version=$(git describe --tags --always --dirty)"
            echo "version_code=$(git rev-list --count HEAD)"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "branch=$(git rev-parse --abbrev-ref HEAD)"
            echo "time_ms=$(( $(git log -1 --format=%ct) * 1000 ))"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: chipbox-server:ci
          build-args: |
            NODE_VERSION=${{ steps.pins.outputs.node }}
            YARN_VERSION=${{ steps.pins.outputs.yarn }}
            EMSDK_VERSION=${{ steps.pins.outputs.emsdk }}
            CHIPBOX_BUILD_VERSION=${{ steps.buildinfo.outputs.version }}
            CHIPBOX_BUILD_VERSION_CODE=${{ steps.buildinfo.outputs.version_code }}
            CHIPBOX_BUILD_COMMIT=${{ steps.buildinfo.outputs.commit }}
            CHIPBOX_BUILD_BRANCH=${{ steps.buildinfo.outputs.branch }}
            CHIPBOX_BUILD_TIME_MS=${{ steps.buildinfo.outputs.time_ms }}
          cache-from: type=gha,scope=web-amd64
          cache-to: type=gha,mode=max,scope=web-amd64
      - name: Smoke the container (health, SPA, all nine WASM pairs, native lib arch)
        run: scripts/ci/web-image-smoke.sh chipbox-server:ci --platform linux/amd64

  shared-build:
    # Gate the heavy whole-graph compile behind ktlint + detekt: fail fast on a lint/style break
    # before spending a compile on it (mirrors the former CircleCI shared-build ← static-analysis edge).
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile shared JVM code
        run: ./gradlew :apps:jvm:classes --build-cache --no-daemon --max-workers=4

  benchmark-build:
    # The `:benchmark` device-test module is in no other job's task graph — ktlint/detekt lint it
    # (via static-analysis) but nothing compiles it, so a compile break would only surface on a
    # device run. Compile it here.
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the device-benchmark module
        run: ./gradlew :benchmark:compileBenchmarkKotlin --build-cache --no-daemon --max-workers=2 -Pchipbox.skipNative

  unit-test:
    # Behind static-analysis so a syntax/style break fails fast in the cheap job rather than burning
    # compile time here (mirrors the former CircleCI unit-test-jvm ← static-analysis edge).
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # jvmTest spins up Compose Desktop windows, so it needs an X display — same xvfb wrapper CI used.
      - name: jvmTest (commonTest JVM target)
        run: xvfb-run -a ./gradlew jvmTest --continue --build-cache --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: '**/build/test-results/**/TEST-*.xml'

  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true # Paparazzi golden snapshots are the only LFS-tracked files
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Paparazzi snapshots
        run: ./gradlew verifyPaparazziDebug --continue --build-cache --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paparazzi-diffs
          path: '**/build/paparazzi/**'

  android-lint:
    # Starts only once the shared code compiles: lintRelease compiles the release graph, whose Kotlin
    # compiles land in the remote build cache for android-apk to hit (mirrors CircleCI android-lint ←
    # shared-build). shared-build itself gates on static-analysis, so this never runs on lint-failing code.
    needs: shared-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android lint (release)
        run: ./gradlew :apps:android:lintRelease --build-cache --no-daemon --max-workers=4 -Pchipbox.skipNative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: 'apps/android/build/reports/**'

  desktop-linux:
    # Behind shared-build so the shared Kotlin compiles are remote-cache hits here; this job then only
    # adds the host-native libs + the desktop app image (mirrors CircleCI build-release-jvm ← shared-build).
    needs: shared-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Builds the jpackage app image (host emulator natives via the image's gcc/g++/make + jlink
      # runtime) — the desktop packaging path after the move to compose.desktop.application. The
      # OS-specific installers (.deb/.rpm) are release-only; this just proves the app assembles.
      - name: Build desktop app image (Linux)
        run: ./gradlew :apps:jvm:createDistributable --build-cache --no-daemon --max-workers=4

  android-apk:
    # Last in the chain: android-lint compiled the release graph into the remote build cache, so this
    # job's assembleRelease hits those Kotlin compiles and only adds the assemble-only work (dexing,
    # native build, APK packaging) — mirrors CircleCI build-release-apk ← android-lint.
    needs: android-lint
    runs-on: ubuntu-latest
    env:
      # Release signing — without these the APK is debug-signed (apps/android/build.gradle.kts).
      CHIPBOX_KEY_ALIAS: ${{ secrets.CHIPBOX_KEY_ALIAS }}
      CHIPBOX_KEYSTORE_PASSWORD: ${{ secrets.CHIPBOX_KEYSTORE_PASSWORD }}
      CHIPBOX_KEY_PASSWORD: ${{ secrets.CHIPBOX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history + tags for appVersioning's git describe
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Puts sdkmanager on PATH and accepts SDK licenses (it isn't on PATH by default on ubuntu-latest).
      # `packages` is overridden because the action's default ('tools platform-tools') requests the
      # legacy `tools` package, which Google removed from the SDK repo — installing it now fails the
      # step with "Failed to find package 'tools'". platform-tools alone is all we need.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      # Cache the ~1GB NDK (+ CMake) so only the first run pays the download. Path is the stable
      # ubuntu-latest SDK location; a miss just re-installs.
      - name: Cache NDK + CMake
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/29.0.14206865
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-29.0.14206865-cmake-3.22.1
      # The Android emulator natives need the pinned NDK + an SDK CMake (NativeEmulators).
      - name: Install NDK + CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release (split APKs)
        run: ./gradlew :apps:android:assembleRelease -PdisablePreDex --build-cache --no-daemon --max-workers=4
      - name: Name APKs by version + ABI
        run: ./scripts/ci/rename-release-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: apps/android/build/outputs/apk/release/chipbox-*.apk
