name: Release

# Tag-triggered release: builds the Linux desktop installers (.deb / .rpm) and the split signed APKs,
# then publishes them all to a GitHub Release via the built-in GITHUB_TOKEN (no PAT). See
# arch-docs/ci-actions-migration.md.
#
# Desktop packaging is jpackage via compose.desktop.application (apps/jvm). The emulator natives are
# bundled into the app image and java.library.path is pointed at them ($APPDIR/resources).
#
# Windows .msi and macOS .dmg are NOT produced yet: jpackage can't cross-compile, so each needs to run
# on its own runner, and the native emulator build has no native Windows-host or macOS/darwin path yet
# (only LINUX-native + WINDOWS_X64 MinGW-cross exist). Those are later phases — see the doc.
#
# This is the sole release path (CircleCI is deleted) but has NOT yet run on a real tag — the first tag
# push is its live test. workflow_dispatch exercises the build jobs only; the publish step is gated to
# tag refs, so a manual branch run won't create a Release.

on:
  push:
    tags: ['[0-9]+.[0-9]+*'] # mirrors the old /^\d+\.\d+.*/ — e.g. 3.0.0-beta04
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight publish

env:
  # Remote Gradle build cache (gradle.sebacloud.org): anonymous read always; push needs CI + these.
  GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
  GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}

jobs:
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history + tags
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # build-essential: host emulator natives (resolveNativeHostTarget → LINUX). fakeroot + binutils:
      # jpackage's .deb step. rpm: jpackage's .rpm step (rpmbuild). Temurin 21 ships jpackage itself.
      - name: Install toolchains (native build + jpackage deb/rpm)
        run: sudo apt-get update && sudo apt-get install -y build-essential fakeroot binutils rpm
      - uses: gradle/actions/setup-gradle@v4
      # jpackage demands a strict numeric version (X.Y.Z); sanitize the tag to its numeric prefix
      # (3.0.0-beta04 → 3.0.0). Non-tag dispatch runs fall back to 0.0.0 (never published).
      - name: Build Linux installers (.deb / .rpm)
        run: |
          VERSION="$(printf '%s' "${{ github.ref_name }}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo '0.0.0')"
          echo "jpackage version: $VERSION"
          ./gradlew :apps:jvm:packageDeb :apps:jvm:packageRpm \
            -Pchipbox.jvm.packageVersion="$VERSION" \
            --build-cache --no-configuration-cache --no-daemon --max-workers=4
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            apps/jvm/build/compose/binaries/main/deb/*.deb
            apps/jvm/build/compose/binaries/main/rpm/*.rpm

  # desktop-windows / desktop-macos: DEFERRED. jpackage can't cross-compile, so a Windows .msi must run
  # on windows-latest and a macOS .dmg on macos-latest — each needs the emulator cores built natively on
  # that OS. The native build has no Windows-host or macOS/darwin path yet (NativeEmulators supports only
  # LINUX-native + WINDOWS_X64 MinGW-cross), so until those land no Windows/macOS desktop artifact ships.
  # The MinGW cross-compiled distZip the old Windows leg produced is gone with the application plugin.

  android-apk:
    runs-on: ubuntu-latest
    env:
      # Release signing — without these the APK is debug-signed (apps/android/build.gradle.kts).
      CHIPBOX_KEY_ALIAS: ${{ secrets.CHIPBOX_KEY_ALIAS }}
      CHIPBOX_KEYSTORE_PASSWORD: ${{ secrets.CHIPBOX_KEYSTORE_PASSWORD }}
      CHIPBOX_KEY_PASSWORD: ${{ secrets.CHIPBOX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Cache NDK + CMake
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/29.0.14206865
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-29.0.14206865-cmake-3.22.1
      - name: Install NDK + CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release (split APKs)
        run: ./gradlew :apps:android:assembleRelease -PdisablePreDex --build-cache --no-configuration-cache --no-daemon --max-workers=4
      - name: Name APKs by version + ABI
        run: ./scripts/rename-release-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: apps/android/build/outputs/apk/release/chipbox-*.apk

  publish:
    needs: [desktop-linux, android-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # publish only for tag pushes, not manual branch runs
    permissions:
      contents: write # create the Release + upload assets via the built-in GITHUB_TOKEN
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect assets
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.apk' \) -exec cp {} upload/ \;
          echo "Assets to publish:"; ls -la upload
          [ -n "$(ls -A upload)" ] || { echo "ERROR: no staged artifacts"; exit 1; }
      # alpha/beta/rc tags ship as prereleases; notes are auto-generated from commits.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "${{ github.ref_name }}" in *alpha*|*beta*|*rc*) PRERELEASE="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" upload/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes $PRERELEASE
          echo "Published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
