name: Release

# Tag-triggered release: builds the desktop installers (Linux .deb/.rpm + Windows .msi) and the split
# signed APKs, publishes them to a GitHub Release via the built-in GITHUB_TOKEN (no PAT), and refreshes
# the download page. Full reference: arch-docs/release-process.md.
#
# Desktop packaging is jpackage via compose.desktop.application (apps/jvm). Linux/macOS build natively
# on their runners; the Windows .dll are cross-compiled on a Linux job (jpackage assembles but doesn't
# compile native code) and fed to the windows-latest packaging job.
#
# workflow_dispatch exercises the build jobs only; the publish step is gated to tag refs, so a manual
# run won't create a Release.

on:
  push:
    tags: ['[0-9]+.[0-9]+*'] # mirrors the old /^\d+\.\d+.*/ — e.g. 3.0.0-beta05
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight publish

env:
  # Remote Gradle build cache (gradle.sebacloud.org): anonymous read always; push needs CI + these.
  GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
  GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}

jobs:
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history + tags
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # build-essential: host emulator natives (resolveNativeHostTarget → LINUX). fakeroot + binutils:
      # jpackage's .deb step. rpm: jpackage's .rpm step (rpmbuild). Temurin 21 ships jpackage itself.
      - name: Install toolchains (native build + jpackage deb/rpm)
        run: sudo apt-get update && sudo apt-get install -y build-essential fakeroot binutils rpm
      - uses: gradle/actions/setup-gradle@v4
      # jpackage demands a strict numeric version (X.Y.Z); sanitize the tag to its numeric prefix
      # (3.0.0-beta04 → 3.0.0). Non-tag dispatch runs fall back to 1.0.0 (never published; macOS
      # jpackage rejects a zero major, and 1.0.0 is valid everywhere).
      - name: Build Linux installers (.deb / .rpm)
        run: |
          VERSION="$(printf '%s' "${{ github.ref_name }}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo '1.0.0')"
          echo "jpackage app-version (embedded OS-package metadata): $VERSION"
          ./gradlew :apps:jvm:packageDeb :apps:jvm:packageRpm \
            -Pchipbox.jvm.packageVersion="$VERSION" \
            --build-cache --no-daemon --max-workers=4
      # jpackage names files by the numeric app-version; relabel with the full version name (the tag),
      # e.g. chipbox-3.0.0-beta04-amd64.deb. The embedded deb/rpm Version stays the numeric $VERSION
      # above — those fields reject a prerelease suffix, so the full name only lives in the filename.
      - name: Label installers with the full version name
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          d=apps/jvm/build/compose/binaries/main
          mv "$d"/deb/*.deb "$d/deb/chipbox-${VERSION_NAME}-amd64.deb"
          mv "$d"/rpm/*.rpm "$d/rpm/chipbox-${VERSION_NAME}-x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          # Installers are already compressed — skip artifact re-compression (the zip wrapper is
          # unavoidable, but there's no gain). The published Release assets are the raw files.
          compression-level: 0
          path: |
            apps/jvm/build/compose/binaries/main/deb/*.deb
            apps/jvm/build/compose/binaries/main/rpm/*.rpm

  # Windows .msi is built in two stages because jpackage can't cross-compile but doesn't compile native
  # code either — it only assembles. So we cross-compile the emulator .dll on ubuntu (the proven MinGW
  # path) and hand them to a windows-latest job that runs jpackage over them. No native Windows toolchain
  # needed. (macOS is different — it builds natively on macos-latest; see the desktop-macos job below.)
  windows-natives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # MinGW-w64 cross toolchain + static MinGW zlib so the .dll link fully static. POSIX-threads
      # variant so std::thread / pthreads cores build.
      - name: Install MinGW-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 libz-mingw-w64-dev
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      # JNI is compiled against a *Windows* JDK's headers (include/win32/jni_md.h); only headers are read.
      - name: Cache Windows JDK (win32 JNI headers)
        id: winjdk
        uses: actions/cache@v4
        with:
          path: ~/win-jdk
          key: win-jdk-temurin-21-v1
      - name: Fetch Windows JDK
        if: steps.winjdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/win-jdk"
          curl -fsSL -o /tmp/winjdk.zip "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jdk/hotspot/normal/eclipse?project=jdk"
          unzip -q /tmp/winjdk.zip -d "$HOME/win-jdk"
      - uses: gradle/actions/setup-gradle@v4
      # Bound native parallelism (mGBA alone is ~150 files); an unbounded make -j OOM-kills the runner.
      - name: Cross-compile Windows emulator natives (.dll)
        run: |
          WIN_JDK_HOME="$(find "$HOME/win-jdk" -maxdepth 1 -type d -name 'jdk-*' | head -1)"
          ./gradlew :apps:jvm:chipboxHostNativeLibs --build-cache --no-daemon --max-workers=4 \
            -Pchipbox.jvm.nativeTarget=windows-x64 \
            -Pchipbox.jvm.nativeJdk="$WIN_JDK_HOME" \
            -Pchipbox.native.maxParallel=2
      - uses: actions/upload-artifact@v4
        with:
          name: windows-natives
          path: apps/jvm/build/jvm-native/libs/*.dll

  desktop-windows:
    needs: windows-natives
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # jpackage's .msi step shells out to WiX v3. windows-latest preinstalls it (the choco
      # `wixtoolset` package tracks v3.x), so this is a no-op safety net for future images that might
      # drop it. No --version pin: pinning a patch older than the preinstalled one makes choco fail as
      # a downgrade, and an unpinned install just skips when a same-or-newer version is already present.
      - name: Ensure WiX Toolset (v3, for jpackage .msi)
        run: choco install wixtoolset -y --no-progress
      # Download the cross-compiled .dll into apps/jvm so a relative -P path resolves against the
      # project dir on Windows (avoids Git-Bash vs Windows path-separator issues with an absolute path).
      - name: Download cross-compiled natives
        uses: actions/download-artifact@v4
        with:
          name: windows-natives
          path: apps/jvm/prebuilt-natives
      - uses: gradle/actions/setup-gradle@v4
      # nativeTarget=windows-x64 + nativeJdk=$JAVA_HOME so the chipbox.native.host plugin's eager apply
      # resolves a win32-JNI-header JDK (the runner's own Windows JDK). It defaults to LINUX (no matching
      # JDK here), and the WINDOWS_X64 path requires the explicit nativeJdk. The native build itself is
      # skipped via prebuiltNativeDir; this only satisfies the plugin apply.
      - name: Build Windows installer (.msi)
        shell: bash
        run: |
          VERSION="$(printf '%s' "${{ github.ref_name }}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo '1.0.0')"
          echo "jpackage version: $VERSION"
          ./gradlew :apps:jvm:packageMsi \
            -Pchipbox.jvm.packageVersion="$VERSION" \
            -Pchipbox.jvm.prebuiltNativeDir=prebuilt-natives \
            -Pchipbox.jvm.nativeTarget=windows-x64 \
            -Pchipbox.jvm.nativeJdk="$JAVA_HOME" \
            --build-cache --no-daemon --max-workers=4
      # jpackage names the .msi by the numeric app-version; relabel with the full version name (the
      # tag), e.g. chipbox-3.0.0-beta04-x64.msi. The embedded MSI ProductVersion stays numeric.
      - name: Label installer with the full version name
        shell: bash
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          d=apps/jvm/build/compose/binaries/main/msi
          mv "$d"/*.msi "$d/chipbox-${VERSION_NAME}-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          compression-level: 0 # .msi is already compressed
          path: apps/jvm/build/compose/binaries/main/msi/*.msi

  android-apk:
    runs-on: ubuntu-latest
    env:
      # Release signing — without these the APK is debug-signed (apps/android/build.gradle.kts).
      CHIPBOX_KEY_ALIAS: ${{ secrets.CHIPBOX_KEY_ALIAS }}
      CHIPBOX_KEYSTORE_PASSWORD: ${{ secrets.CHIPBOX_KEYSTORE_PASSWORD }}
      CHIPBOX_KEY_PASSWORD: ${{ secrets.CHIPBOX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Cache NDK + CMake
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/29.0.14206865
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-29.0.14206865-cmake-3.22.1
      - name: Install NDK + CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release (split APKs)
        run: ./gradlew :apps:android:assembleRelease -PdisablePreDex --build-cache --no-daemon --max-workers=4
      - name: Name APKs by version + ABI
        run: ./scripts/rename-release-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          compression-level: 0 # APKs (zip-based) are already compressed
          path: apps/android/build/outputs/apk/release/chipbox-*.apk

  # macOS .dmg. Unlike Windows, this builds natively on macos-latest: the emulator cores compile to
  # .dylib with the runner's clang, and jpackage packages the .dmg. macos-latest is Apple Silicon, so
  # the .dmg is arm64. Ships UNSIGNED (Gatekeeper warns; TODO: Developer-ID signing + notarization).
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # clang + ar ship with Xcode; CMake usually preinstalled — install defensively (no-op if present).
      - name: Ensure CMake
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - uses: gradle/actions/setup-gradle@v4
      # resolveNativeHostTarget defaults to MACOS on this runner and the native JDK (darwin JNI headers)
      # is the runner's own, so no -Pchipbox.jvm.nativeTarget / nativeJdk needed.
      - name: Build macOS installer (.dmg)
        run: |
          VERSION="$(printf '%s' "${{ github.ref_name }}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo '1.0.0')"
          echo "jpackage app-version: $VERSION"
          ./gradlew :apps:jvm:packageDmg \
            -Pchipbox.jvm.packageVersion="$VERSION" \
            --build-cache --no-daemon --max-workers=4
      # jpackage writes its real error to a log file, not stdout — surface it so a failure is diagnosable.
      - name: Show jpackage logs on failure
        if: failure()
        run: |
          find apps/jvm/build/compose/logs -name '*.txt' -print -exec cat {} \; 2>/dev/null \
            || echo "no jpackage logs found"
      # jpackage names the .dmg by the numeric app-version; relabel with the full tag + arch.
      - name: Label installer with the full version name
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          d=apps/jvm/build/compose/binaries/main/dmg
          mv "$d"/*.dmg "$d/chipbox-${VERSION_NAME}-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          compression-level: 0 # .dmg is already compressed
          path: apps/jvm/build/compose/binaries/main/dmg/*.dmg

  publish:
    needs: [desktop-linux, desktop-windows, desktop-macos, android-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # publish only for tag pushes, not manual branch runs
    permissions:
      contents: write # create the Release + upload assets, and commit the refreshed download page
      actions: write # dispatch pages.yml to redeploy the download page
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect assets
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.dmg' -o -name '*.apk' \) \
            -exec cp {} upload/ \;
          echo "Assets to publish:"; ls -la upload
          [ -n "$(ls -A upload)" ] || { echo "ERROR: no staged artifacts"; exit 1; }
      # alpha/beta/rc tags ship as prereleases; notes are auto-generated from commits.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "${{ github.ref_name }}" in *alpha*|*beta*|*rc*) PRERELEASE="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" upload/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes $PRERELEASE
          echo "Published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
      # Keep the landing site's download links in sync with this release: regenerate download.md from
      # the just-published assets, commit it to beta, then dispatch the Pages deploy. (A GITHUB_TOKEN
      # commit doesn't trigger the push-based Pages build — hence the explicit workflow_dispatch, which
      # is exempt from that recursion rule.)
      - name: Checkout beta (to update the download page)
        uses: actions/checkout@v4
        with:
          ref: beta
          path: site-src
      - name: Refresh + deploy the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site-src
          bash scripts/gen-download-page.sh "${{ github.ref_name }}" ../upload > docs/download.md
          if git diff --quiet -- docs/download.md; then
            echo "Download page already current for ${{ github.ref_name }}."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "docs(site): point downloads at ${{ github.ref_name }}"
            git push origin beta
          fi
          gh workflow run pages.yml --ref beta
