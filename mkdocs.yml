site_name: Chipbox
site_url: https://sigmabeta.github.io/chipbox/
site_description: "A chiptune jukebox that emulates old console sound chips in real time. Kotlin Multiplatform, Compose UI, Android & desktop."
site_author: sigmabeta
repo_name: chipbox
repo_url: https://github.com/sigmabeta/chipbox
edit_uri: edit/beta/docs/
remote_branch: gh-pages

copyright: 'Copyright &copy; 2026 sigmabeta'

# Architecture documentation lives in arch-docs/; docs/ is the MkDocs site source
# (the default docs_dir), so the landing page sits at a standardized location.

theme:
  name: 'material'
  favicon: assets/app-logo.svg
  logo: assets/app-logo.svg
  palette:
    - media: '(prefers-color-scheme)'
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: 'white'
      accent: 'amber'
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: 'black'
      accent: 'amber'
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: 'Inter'
    code: 'Fira Code'
  features:
    - content.code.copy
    - content.code.select
    - navigation.tabs
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest

extra_css:
  - assets/extra.css

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sigmabeta/chipbox

markdown_extensions:
  - smarty
  - footnotes
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
  - attr_list
  - md_in_html

nav:
  - 'Home': index.md
  - 'Download': download.md
  - 'Build': build.md
