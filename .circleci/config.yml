version: 2

submodule_init: &submodule_init
  run:
    name: Initialize submodules
    command: git submodule sync && git submodule update --init --recursive

workflows:
  version: 2
  build_analyze:
    jobs:
      - setup
      - kt-lint:
          requires:
            - setup
      - detekt:
          requires:
            - setup
      - android-lint:
          requires:
            - setup
      - screenshot-test:
          requires:
            - setup
      - build_release_apk:
          requires:
            - kt-lint
            - detekt
            - android-lint

##################################################

jobs:
  setup:
    resource_class: medium

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx3200m

    steps:
      - restore_cache:
          keys:
            - source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - *submodule_init
      - restore_cache:
          keys:
            - jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum  "app/build.gradle.kts" }}
            - jars-v1-
      - run:
          name: Download Dependencies
          # AGP 9 removed `androidDependencies`; resolving :app's classpaths
          # pulls the dependency graph into the shared ~/.gradle cache.
          command: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-configuration-cache --no-daemon --max-workers=1
      - save_cache:
          key: jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum  "app/build.gradle.kts" }}
          # Only the artifact + wrapper caches — not all of ~/.gradle (daemon
          # logs, transient state) which bloats save/restore time.
          paths:
            - ~/.gradle/caches/modules-2
            - ~/.gradle/wrapper
      - run:
          name: Get all Git tags
          command: git fetch --prune --prune-tags && git fetch --tags -f
      - save_cache:
          key: source-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ".git"
            - "sage"

  kt-lint:
    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx2048m

    steps:
      # ktlint-check.sh downloads the ktlint binary and lints source directly;
      # it uses no Gradle, so the sage submodule and jars cache aren't needed
      # (and skipping the submodule keeps vendored sage/ out of the lint set).
      - restore_cache:
          keys:
            - source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - run:
          name: Run Ktlint
          command: ./ktlint-check.sh
      - store_artifacts:
          path: ktlint.html
          destination: ktlint-reports

  detekt:
    resource_class: medium

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx3200m

    steps:
      - restore_cache:
          keys:
            - source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - *submodule_init
      - restore_cache:
          keys:
            - jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum  "app/build.gradle.kts" }}
            - jars-v1-
      - restore_cache:
          keys:
            - build-cache-detekt-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-detekt-v1-{{ .Branch }}-
            - build-cache-detekt-v1-
      - run:
          name: Run Detekt checks
          command: ./gradlew detekt --build-cache --no-configuration-cache --no-daemon --max-workers=2
      - save_cache:
          key: build-cache-detekt-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1

  android-lint:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      # Start off with a 4GB heap size; expand up to 6GB
      JVM_OPTS: -Xms4g -Xmx6g

    steps:
      - restore_cache:
          keys:
            - source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - *submodule_init
      - restore_cache:
          keys:
            - jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum  "app/build.gradle.kts" }}
            - jars-v1-
      - restore_cache:
          keys:
            - build-cache-lint-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-lint-v1-{{ .Branch }}-
            - build-cache-lint-v1-
      - run:
          name: Run Android Lint checks
          command: ./gradlew :app:lintRelease --build-cache --no-configuration-cache --no-daemon --max-workers=4
      - save_cache:
          key: build-cache-lint-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      - store_artifacts:
          path: app/build/reports/
          destination: reports

  screenshot-test:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx512m

    steps:
      - restore_cache:
          keys:
            - source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - *submodule_init
      - restore_cache:
          keys:
            - jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum  "app/build.gradle.kts" }}
            - jars-v1-
      - restore_cache:
          keys:
            - build-cache-screenshot-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-screenshot-v1-{{ .Branch }}-
            - build-cache-screenshot-v1-
      - run:
          name: Pull Paparazzi golden snapshots from Git LFS
          command: git lfs install --local && git lfs pull
      - run:
          name: Compare screenshot tests
          command: ./gradlew verifyPaparazziDebug --build-cache --no-configuration-cache --no-daemon --max-workers=2
      - save_cache:
          key: build-cache-screenshot-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      - store_artifacts:
          path: features/search/screenshot/build/paparazzi/failures/
          destination: failure-screenshots/search
      - store_artifacts:
          path: features/artist-detail/screenshot/build/paparazzi/failures/
          destination: failure-screenshots/artist-detail
      - store_artifacts:
          path: features/game-detail/screenshot/build/paparazzi/failures/
          destination: failure-screenshots/game-detail

  build_release_apk:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      # Start off with a 4GB heap size; expand up to 6GB
      JVM_OPTS: -Xms4g -Xmx6g

    steps:
      - restore_cache:
          keys:
            - source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - *submodule_init
      - restore_cache:
          keys:
            - jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum  "app/build.gradle.kts" }}
            - jars-v1-
      - restore_cache:
          keys:
            - build-cache-apk-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-apk-v1-{{ .Branch }}-
            - build-cache-apk-v1-
      # Release signing reads CHIPBOX_KEY_ALIAS / CHIPBOX_KEYSTORE_PASSWORD /
      # CHIPBOX_KEY_PASSWORD from CircleCI project env vars (chipbox.jks is
      # committed at the repo root). Without them the APK is debug-signed.
      - run:
          name: Build Release
          command: ./gradlew :app:assembleRelease -PdisablePreDex --build-cache --no-configuration-cache --no-daemon --max-workers=4
      - save_cache:
          key: build-cache-apk-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      - store_artifacts:
          path: app/build/outputs/apk/release
          destination: outputs
