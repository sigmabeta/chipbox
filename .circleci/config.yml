version: 2

# Optimization 2: `setup` checks out + resolves + compiles once, then a
# workspace carries the repo (incl. the `sage` submodule and `.git`), the
# resolved Gradle home, and the warm build cache to every downstream job.
# Downstream jobs attach the workspace instead of re-cloning / re-resolving /
# recompiling, so their Gradle runs are mostly UP-TO-DATE.
#
# Workspace root is the home dir so both `project` and `.gradle` fit under it.
workspace_root: &workspace_root /home/circleci

attach_ws: &attach_ws
  attach_workspace:
    at: *workspace_root

# The emulator modules build native code via CMake, which needs Ninja. The
# cimg/android image ships CMake but not Ninja, so install it onto PATH (where
# AGP looks) before any job that may configure a native build.
install_ninja: &install_ninja
  run:
    name: Install Ninja (required for native CMake builds)
    command: sudo apt-get update -y && sudo apt-get install -y ninja-build

workflows:
  version: 2
  build_analyze:
    jobs:
      # kt-lint is self-contained (no Gradle / submodule) — run it in parallel
      # with setup rather than gating it behind setup.
      - kt-lint
      - setup
      - detekt:
          requires:
            - setup
      - android-lint:
          requires:
            - setup
      - screenshot-test:
          requires:
            - setup
      - build_release_apk:
          requires:
            - kt-lint
            - detekt
            - android-lint

##################################################

jobs:
  setup:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      # setup now compiles the app graph; size the heap like the build jobs.
      JVM_OPTS: -Xms4g -Xmx6g

    steps:
      - restore_cache:
          keys:
            - source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - run:
          name: Initialize submodules
          command: git submodule sync && git submodule update --init --recursive
      - run:
          name: Get all Git tags
          command: git fetch --prune --prune-tags && git fetch --tags -f
      - *install_ninja
      - restore_cache:
          keys:
            - jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum  "app/build.gradle.kts" }}
            - jars-v1-
      - restore_cache:
          keys:
            - build-cache-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-v1-{{ .Branch }}-
            - build-cache-v1-
      - run:
          name: Resolve dependencies and compile the app graph
          # Compiling once here warms the build + configuration caches and the
          # Gradle home that the workspace then shares with downstream jobs.
          command: ./gradlew :app:assembleRelease -PdisablePreDex --build-cache --configuration-cache --no-daemon --max-workers=4
      # Cross-run caches keep `setup` itself fast on repeat builds; the
      # workspace handles intra-run sharing for the downstream jobs.
      - save_cache:
          key: jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum  "app/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches/modules-2
            - ~/.gradle/wrapper
      - save_cache:
          key: build-cache-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      - save_cache:
          key: source-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ".git"
            - "sage"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            # `project` carries .gradle/configuration-cache so build_release_apk
            # reuses setup's :app:assembleRelease configuration-cache entry.
            - project
            - .gradle/caches/modules-2
            - .gradle/caches/build-cache-1
            - .gradle/wrapper

  kt-lint:
    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx2048m

    steps:
      # ktlint-check.sh downloads the ktlint binary and lints source directly;
      # it uses no Gradle, so the sage submodule and Gradle home aren't needed
      # (and skipping the submodule keeps vendored sage/ out of the lint set).
      - restore_cache:
          keys:
            - source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - run:
          name: Run Ktlint
          command: ./ktlint-check.sh
      - store_artifacts:
          path: ktlint.html
          destination: ktlint-reports

  detekt:
    resource_class: medium

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx3200m

    steps:
      - *attach_ws
      - *install_ninja
      - run:
          name: Run Detekt checks
          command: ./gradlew detekt --build-cache --configuration-cache --no-daemon --max-workers=2

  android-lint:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      # Start off with a 4GB heap size; expand up to 6GB
      JVM_OPTS: -Xms4g -Xmx6g

    steps:
      - *attach_ws
      - *install_ninja
      - run:
          name: Run Android Lint checks
          command: ./gradlew :app:lintRelease --build-cache --configuration-cache --no-daemon --max-workers=4
      - store_artifacts:
          path: app/build/reports/
          destination: reports

  screenshot-test:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx512m

    steps:
      - *attach_ws
      - *install_ninja
      - run:
          name: Pull Paparazzi golden snapshots from Git LFS
          command: git lfs install --local && git lfs pull
      - run:
          name: Compare screenshot tests
          command: ./gradlew verifyPaparazziDebug --build-cache --configuration-cache --no-daemon --max-workers=2
      - store_artifacts:
          path: features/search/screenshot/build/paparazzi/failures/
          destination: failure-screenshots/search
      - store_artifacts:
          path: features/artist-detail/screenshot/build/paparazzi/failures/
          destination: failure-screenshots/artist-detail
      - store_artifacts:
          path: features/game-detail/screenshot/build/paparazzi/failures/
          destination: failure-screenshots/game-detail

  build_release_apk:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      # Start off with a 4GB heap size; expand up to 6GB
      JVM_OPTS: -Xms4g -Xmx6g

    steps:
      - *attach_ws
      - *install_ninja
      # Release signing reads CHIPBOX_KEY_ALIAS / CHIPBOX_KEYSTORE_PASSWORD /
      # CHIPBOX_KEY_PASSWORD from CircleCI project env vars (chipbox.jks is
      # committed at the repo root). Without them the APK is debug-signed.
      # The workspace already holds setup's release build + configuration-cache
      # entry, so this is mostly UP-TO-DATE and just collects the artifact.
      - run:
          name: Build Release
          command: ./gradlew :app:assembleRelease -PdisablePreDex --build-cache --configuration-cache --no-daemon --max-workers=4
      - store_artifacts:
          path: app/build/outputs/apk/release
          destination: outputs
