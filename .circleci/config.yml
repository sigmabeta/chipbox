version: 2

# `setup` is a real setup step — it checks out, inits the `sage` submodule,
# fetches tags, and resolves dependencies once, then a workspace carries the
# repo (incl. `sage` and `.git`) and the resolved Gradle dependency cache to
# every downstream job. Downstream jobs attach the workspace instead of
# re-cloning / re-resolving. They compile only what they need; native code is
# built only in the jobs that actually require it.
#
# Compiled output is carried forward via two independent Gradle build-cache
# lineages, because a KMP module's jvm-target compile and its android-`release`
# compile are different tasks (different cache keys) and cannot share an entry:
#   * build-cache-jvm-v1     : shared-build -> build-release-jvm
#   * build-cache-release-v1 : android-lint -> build-release-apk
# Each downstream job restores its lineage and re-saves under the same key (a
# CircleCI no-op when the upstream job already stored that revision), so the
# expensive Kotlin compiles happen once per lineage.
#
# Workspace root is the home dir so both `project` and `.gradle` fit under it.
workspace_root: &workspace_root /home/circleci

attach_ws: &attach_ws
  attach_workspace:
    at: *workspace_root

# The emulator modules build native code via CMake, which needs Ninja. The
# cimg/android image ships neither an SDK CMake nor Ninja; installing the SDK
# CMake package bundles Ninja in its bin folder, which AGP auto-detects (no
# PATH wrangling). Only jobs that actually build native code need this.
install_cmake: &install_cmake
  run:
    name: Install SDK CMake (bundles Ninja for native builds)
    # `yes` gets SIGPIPE (exit 141) once sdkmanager stops reading; under
    # CircleCI's `bash -eo pipefail` that would fail the step. `yes || true`
    # absorbs the signal so only sdkmanager's real exit status counts.
    command: (yes || true) | sdkmanager "cmake;3.22.1"

# The JVM target's emulator libs are host-built (host CMake's default Unix
# Makefiles generator + gcc/g++/make/ar), NOT via the NDK. apps/jvm's build
# script runs the CMake configure/build Exec tasks during installDist; they
# resolve the `cmake` binary through $ANDROID_HOME (the SDK 3.22.1 that
# install_cmake drops in — same version AGP uses), but the compile itself needs
# a host C/C++ toolchain that the cimg/android image doesn't guarantee. Only
# build-release-jvm builds host-native code, so only it needs this.
install_host_toolchain: &install_host_toolchain
  run:
    name: Install host C/C++ toolchain (gcc/g++/make for JVM native libs)
    command: sudo apt-get update && sudo apt-get install -y build-essential

# Sweep every module's `build/reports/` (ktlint, detekt, html test reports, lint,
# whatever lives there) into one tree keyed by module path. Runs `when: always`
# so a failing check still ships its report. `./sage` is the vendored submodule
# (its own included build) — its reports come from a separate build invocation,
# don't collect them. The matched dir is `-prune`d so find doesn't descend back
# into it; the cp -r grabs the whole tree.
collect_reports: &collect_reports
  run:
    name: Collect build/reports from every module
    when: always
    command: |
      mkdir -p ~/reports
      find . -path './sage' -prune -o \
             -path '*/build/reports' -type d -print -prune | while read d; do
        mod=$(echo "$d" | sed 's|^\./||;s|/build/reports$||;s|/|-|g')
        mkdir -p ~/reports/"$mod" && cp -r "$d"/. ~/reports/"$mod"/
      done

# Sweep every module's JUnit-format `TEST-*.xml` into one tree CircleCI can
# parse into the Tests tab. Per-module subdir so each suite shows up
# separately. Same `when: always` + sage-exclusion rationale as collect_reports.
collect_test_results: &collect_test_results
  run:
    name: Collect JUnit XML test results from every module
    when: always
    command: |
      mkdir -p ~/test-results
      find . -path './sage' -prune -o \
             -path '*/build/test-results/*' -name 'TEST-*.xml' -print | while read f; do
        mod=$(echo "$f" | sed 's|^\./||;s|/build/test-results/.*$||;s|/|-|g')
        mkdir -p ~/test-results/"$mod" && cp "$f" ~/test-results/"$mod"/
      done

# Paparazzi's failure / diff images live under `build/paparazzi/`, NOT under
# `build/reports/`, so collect_reports misses them. Each screenshot module
# gets its own subdir in the artifact tree so a regression is one click away.
collect_paparazzi: &collect_paparazzi
  run:
    name: Collect Paparazzi failure / diff images from every screenshot module
    when: always
    command: |
      mkdir -p ~/paparazzi
      find . -path './sage' -prune -o \
             -path '*/build/paparazzi' -type d -print -prune | while read d; do
        mod=$(echo "$d" | sed 's|^\./||;s|/build/paparazzi$||;s|/|-|g')
        mkdir -p ~/paparazzi/"$mod" && cp -r "$d"/. ~/paparazzi/"$mod"/
      done

workflows:
  version: 2
  build_analyze:
    jobs:
      - setup
      # ktlint runs through Gradle now, so it needs the workspace setup produces
      # (Gradle home + the sage submodule included build).
      - kt-lint:
          requires:
            - setup
      - detekt:
          requires:
            - setup
      - screenshot-test:
          requires:
            - setup
      # commonTest unit tests for the chipbox.kmp.test modules — runs the JVM
      # target of every commonTest source set (ViewModel tests, repository
      # tests, etc.). Gates behind kt-lint so a syntax error fails fast on
      # `medium` rather than burning compile time here.
      - unit-test-jvm:
          requires:
            - kt-lint
            - setup
      # Same suites compiled + run against the Kotlin/JS target. Independent
      # swim lane from unit-test-jvm: catches js-vs-jvm divergence
      # (UnconfinedTestDispatcher, SharingStarted, advanceTimeBy timing) that
      # we'd otherwise only discover when shipping the JVM/desktop app or
      # when the eventual web app is built.
      - unit-test-js:
          requires:
            - kt-lint
            - setup
      # shared-build compiles the JVM target of every module shared between the
      # JVM and Android apps. It runs in parallel with detekt (both gate the
      # heavy Android jobs via android-lint below) rather than behind it — same
      # fail-fast guarantee, one less job on the critical path. It gates behind
      # kt-lint as a cheap fail-fast check; setup supplies the workspace.
      - shared-build:
          requires:
            - kt-lint
            - setup
      # Heavy Android jobs start only once the shared code compiles AND detekt
      # passes — so a `large` box is never spent on lint / APK assembly for code
      # that already failed static analysis or the shared compile.
      - android-lint:
          requires:
            - shared-build
            - detekt
      # build-release-jvm finishes the JVM app: it restores shared-build's JVM
      # build cache (compilation = cache hits) and only adds the host-native libs
      # + the desktop distribution on top.
      - build-release-jvm:
          requires:
            - shared-build
      - build-release-apk:
          requires:
            - android-lint

##################################################

jobs:
  setup:
    resource_class: medium

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx3200m

    steps:
      - restore_cache:
          keys:
            - source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - run:
          name: Initialize submodules
          # `submodule sync` realigns each submodule's recorded URL with whatever .gitmodules
          # currently declares — guards against URL drift on a restored cached `.git`. The
          # explicit `foreach … fetch origin` then pulls every ref tip from each submodule's
          # remote before `submodule update` tries to check out the target SHA. Without that
          # foreach, a SHA pushed after the cache was last saved surfaces as a fetch-by-SHA
          # in `submodule update` and GitHub refuses it with `upload-pack: not our ref`
          # (sage's main moved without the cached submodule clone knowing). With the foreach,
          # the SHA arrives via a normal `refs/heads/*` fetch and the checkout finds it
          # locally. `|| true` on the foreach so a brand-new fresh-clone setup (where there's
          # no submodule clone yet to fetch into) doesn't fail the step.
          command: |
            git submodule sync
            git submodule foreach --recursive 'git fetch origin' || true
            git submodule update --init --recursive
      - run:
          name: Get all Git tags
          command: git fetch --prune --prune-tags && git fetch --tags -f
      - run:
          name: Fetch Paparazzi golden snapshots (Git LFS)
          # Done here because `setup` has SSH configured by `checkout`;
          # downstream jobs use attach_workspace and have no SSH set up.
          command: git lfs install --local && git lfs pull
      # Key on every file that can change the resolved dependency set: the root
      # and both app build scripts, plus the version catalog. The JVM app pulls
      # deps the Android release graph doesn't (Compose Desktop + Skia, Voyager,
      # sqlite-bundled, metrox), so a JVM-only bump must bust this cache too.
      - restore_cache:
          keys:
            - jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum "apps/android/build.gradle.kts" }}-{{ checksum "apps/jvm/build.gradle.kts" }}-{{ checksum "sage/gradle/libs.versions.toml" }}
            - jars-v1-
      - run:
          name: Resolve Android app dependencies
          # Dependency resolution only — no compilation, so no native build.
          # Populates ~/.gradle so downstream jobs resolve offline.
          command: ./gradlew :apps:android:dependencies --configuration releaseRuntimeClasspath --no-configuration-cache --no-daemon --max-workers=2
      - run:
          name: Resolve JVM app dependencies
          # The JVM/desktop deps aren't in the Android release classpath, so warm
          # them here too — otherwise shared-build AND build-release-jvm each
          # re-download them (different boxes, neither persists modules-2).
          command: ./gradlew :apps:jvm:dependencies --configuration runtimeClasspath --no-configuration-cache --no-daemon --max-workers=2
      - save_cache:
          key: jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum "apps/android/build.gradle.kts" }}-{{ checksum "apps/jvm/build.gradle.kts" }}-{{ checksum "sage/gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle/caches/modules-2
            - ~/.gradle/wrapper
      - save_cache:
          key: source-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ".git"
            - "sage"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - project
            - .gradle/caches/modules-2
            - .gradle/wrapper

  kt-lint:
    resource_class: medium

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx3200m

    steps:
      - *attach_ws
      - restore_cache:
          keys:
            - build-cache-ktlint-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-ktlint-v1-{{ .Branch }}-
            - build-cache-ktlint-v1-
      - run:
          name: Run Ktlint
          # ktlint runs through Gradle now (org.jlleitschuh.gradle.ktlint). The vendored sage/
          # submodule is a separate included build, so it stays out of the lint set.
          # --continue so a failing module doesn't mask violations in others.
          command: ./gradlew ktlintCheck --continue --build-cache --configuration-cache --no-daemon --max-workers=2
      - save_cache:
          key: build-cache-ktlint-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      - *collect_reports
      - store_artifacts:
          path: ~/reports
          destination: ktlint-reports
          when: always

  detekt:
    resource_class: medium

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx3200m

    steps:
      - *attach_ws
      - restore_cache:
          keys:
            - build-cache-detekt-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-detekt-v1-{{ .Branch }}-
            - build-cache-detekt-v1-
      - run:
          name: Run Detekt checks
          # --continue so a failing module doesn't mask violations in others.
          command: ./gradlew detekt --continue --build-cache --configuration-cache --no-daemon --max-workers=2
      - save_cache:
          key: build-cache-detekt-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      - *collect_reports
      - store_artifacts:
          path: ~/reports
          destination: detekt-reports
          when: always

  shared-build:
    # A whole-graph Kotlin compile of every shared module — give it the headroom
    # the `large` Android jobs get rather than throttling it on `medium`.
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xms2g -Xmx4g

    steps:
      - *attach_ws
      # Dedicated JVM-side build-cache lineage, separate from the Android
      # `release` lineage: a KMP module's jvm-target compile and its
      # android-`release` compile are distinct tasks with distinct cache keys, so
      # they can't share one cache entry. build-release-jvm restores this key.
      - restore_cache:
          keys:
            - build-cache-jvm-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-jvm-v1-{{ .Branch }}-
            - build-cache-jvm-v1-
      - run:
          name: Build shared JVM/Android code
          # `:apps:jvm:classes` compiles apps/jvm plus, transitively, the JVM
          # target of every module it depends on — the 55 sage.kmp shared modules
          # and the pure-JVM sage.jvm modules: as much jvm/android-shared code as
          # can be built in one target. It stops at compilation: native libs and
          # the distribution are only wired into run/installDist/dist*, so neither
          # is triggered here — build-release-jvm adds those. (Pure-JVM modules
          # have no debug/release split; the Android `release` graph is compiled
          # in android-lint, which feeds build-release-apk.)
          command: ./gradlew :apps:jvm:classes --build-cache --configuration-cache --no-daemon --max-workers=4
      - save_cache:
          key: build-cache-jvm-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1

  android-lint:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      # Start off with a 4GB heap size; expand up to 6GB
      JVM_OPTS: -Xms4g -Xmx6g

    steps:
      - *attach_ws
      # lintRelease pulls dependency AARs, which builds the emulator native libs.
      - *install_cmake
      # Shared release build cache: lintRelease and assembleRelease compile the
      # same release graph. build-release-apk requires this job, so it restores
      # what we save here (its identical-key save is then a CircleCI no-op).
      - restore_cache:
          keys:
            - build-cache-release-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-release-v1-{{ .Branch }}-
            - build-cache-release-v1-
      - run:
          name: Run Android Lint checks
          command: ./gradlew :apps:android:lintRelease --build-cache --configuration-cache --no-daemon --max-workers=4
      - save_cache:
          key: build-cache-release-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      # Existing apps/android/build/reports/ kept verbatim so its CircleCI URL
      # stays stable for anyone with a bookmark; the broader collect_reports
      # below picks up any other module that produced reports during lintRelease
      # (e.g. transitive android-resource validation reports).
      - store_artifacts:
          path: apps/android/build/reports/
          destination: reports
          when: always
      - *collect_reports
      - store_artifacts:
          path: ~/reports
          destination: lint-reports
          when: always

  unit-test-jvm:
    resource_class: medium

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xms2g -Xmx4g

    steps:
      - *attach_ws
      # Own build-cache lineage: unit-test compiles the commonTest source set
      # which shared-build's `:apps:jvm:classes` never touches. A shared key
      # would still work (different task hashes, no collisions) but separation
      # keeps the cache rotation easier to reason about.
      - restore_cache:
          keys:
            - build-cache-test-jvm-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-test-jvm-v1-{{ .Branch }}-
            - build-cache-test-jvm-v1-
      - run:
          name: Run JVM unit tests (commonTest @ jvmTest)
          command: ./gradlew jvmTest --continue --build-cache --configuration-cache --no-daemon --max-workers=2
      - save_cache:
          key: build-cache-test-jvm-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      # JUnit XMLs for the CircleCI Tests tab (pass/fail counts, suite drilldown).
      - *collect_test_results
      - store_test_results:
          path: ~/test-results
          when: always
      # HTML test reports + any other build/reports/ output for download.
      - *collect_reports
      - store_artifacts:
          path: ~/reports
          destination: jvm-test-reports
          when: always

  unit-test-js:
    resource_class: medium

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xms2g -Xmx4g

    steps:
      - *attach_ws
      # The build.gradle.kts NodeJsEnvSpec / YarnRootEnvSpec config sets
      # `download = false` to keep `FAIL_ON_PROJECT_REPOS` happy — so we
      # need both binaries on PATH. cimg/android:2024.04.1 ships Node 20;
      # yarn is missing, install via npm. corepack would be tidier but
      # isn't enabled out of the box on this image.
      - run:
          name: Ensure Node + Yarn on PATH
          command: |
            node --version
            command -v yarn || sudo npm install -g yarn@1.22.22
            yarn --version
      # Separate from unit-test-jvm and from the release lineages: JS
      # compile artifacts (Kotlin IR, webpack outputs) are distinct.
      - restore_cache:
          keys:
            - build-cache-test-js-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-test-js-v1-{{ .Branch }}-
            - build-cache-test-js-v1-
      - run:
          name: Run JS unit tests (commonTest @ jsNodeTest)
          # cbox/common/appui/api has jsTest disabled in its build.gradle.kts
          # (top-level CompositionLocals drag Compose UI / Skiko at module
          # init); every other VM module runs here.
          command: ./gradlew jsTest --continue --build-cache --configuration-cache --no-daemon --max-workers=2
      - save_cache:
          key: build-cache-test-js-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      - *collect_test_results
      - store_test_results:
          path: ~/test-results
          when: always
      - *collect_reports
      - store_artifacts:
          path: ~/reports
          destination: js-test-reports
          when: always

  screenshot-test:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      # Paparazzi LayoutLib rendering across the screenshot modules is
      # memory-hungry; the old -Xmx512m GC-thrashed on this `large` box.
      JVM_OPTS: -Xms2g -Xmx4g

    steps:
      # Golden snapshots come from the workspace (setup did the LFS pull;
      # this job has no SSH for git@github.com).
      - *attach_ws
      - restore_cache:
          keys:
            - build-cache-screenshot-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-screenshot-v1-{{ .Branch }}-
            - build-cache-screenshot-v1-
      - run:
          name: Compare screenshot tests
          command: ./gradlew verifyPaparazziDebug --continue --build-cache --configuration-cache --no-daemon --max-workers=2
      - save_cache:
          key: build-cache-screenshot-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      # JUnit XML for the Tests tab (Paparazzi runs as a JUnit test under the hood).
      - *collect_test_results
      - store_test_results:
          path: ~/test-results
          when: always
      # Build-reports (html test reports, lint, etc) and the paparazzi failure
      # images themselves — different roots, different collectors.
      - *collect_reports
      - store_artifacts:
          path: ~/reports
          destination: screenshot-reports
          when: always
      - *collect_paparazzi
      - store_artifacts:
          path: ~/paparazzi
          destination: paparazzi-images
          when: always

  build-release-apk:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      # Start off with a 4GB heap size; expand up to 6GB
      JVM_OPTS: -Xms4g -Xmx6g

    steps:
      - *attach_ws
      # assembleRelease builds the emulator modules' native code via CMake.
      - *install_cmake
      # Shared with android-lint (runs first): restores its compiled release
      # graph so assembleRelease is largely cache hits.
      - restore_cache:
          keys:
            - build-cache-release-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-release-v1-{{ .Branch }}-
            - build-cache-release-v1-
      # Release signing reads CHIPBOX_KEY_ALIAS / CHIPBOX_KEYSTORE_PASSWORD /
      # CHIPBOX_KEY_PASSWORD from CircleCI project env vars (chipbox.jks is
      # committed at the repo root). Without them the APK is debug-signed.
      - run:
          name: Build Release
          command: ./gradlew :apps:android:assembleRelease -PdisablePreDex --build-cache --configuration-cache --no-daemon --max-workers=4
      - save_cache:
          key: build-cache-release-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      - store_artifacts:
          path: apps/android/build/outputs/apk/release
          destination: outputs
          when: always
      # Report sweep so any module-level build-time report from the release
      # graph (e.g. resource shrinker, R8 mapping reports) is downloadable.
      - *collect_reports
      - store_artifacts:
          path: ~/reports
          destination: release-apk-reports
          when: always

  build-release-jvm:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xms2g -Xmx4g

    steps:
      - *attach_ws
      # installDist host-builds the 7 emulator native libs (host CMake + gcc/g++)
      # and bundles them into the distribution. cmake comes from the SDK package;
      # the host C/C++ toolchain from apt.
      - *install_cmake
      - *install_host_toolchain
      # Same JVM build-cache lineage shared-build populated: every Kotlin compile
      # is a cache hit, so this job's real work is just the native build + the
      # distribution layout. The identical-key save below is a CircleCI no-op when
      # shared-build already stored this revision.
      - restore_cache:
          keys:
            - build-cache-jvm-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-jvm-v1-{{ .Branch }}-
            - build-cache-jvm-v1-
      - run:
          name: Build Release (JVM desktop app)
          command: ./gradlew :apps:jvm:installDist --build-cache --configuration-cache --no-daemon --max-workers=4
      - save_cache:
          key: build-cache-jvm-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      - store_artifacts:
          path: apps/jvm/build/install
          destination: jvm-dist
          when: always
      - *collect_reports
      - store_artifacts:
          path: ~/reports
          destination: release-jvm-reports
          when: always
