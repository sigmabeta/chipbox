version: 2

# Optimization 2: `setup` is a real setup step — it checks out, inits the
# `sage` submodule, fetches tags, and resolves dependencies once, then a
# workspace carries the repo (incl. `sage` and `.git`) and the resolved
# Gradle dependency cache to every downstream job. Downstream jobs attach the
# workspace instead of re-cloning / re-resolving. They compile only what they
# need; native code is built only in the jobs that actually require it.
#
# Workspace root is the home dir so both `project` and `.gradle` fit under it.
workspace_root: &workspace_root /home/circleci

attach_ws: &attach_ws
  attach_workspace:
    at: *workspace_root

# The emulator modules build native code via CMake, which needs Ninja. The
# cimg/android image ships neither an SDK CMake nor Ninja; installing the SDK
# CMake package bundles Ninja in its bin folder, which AGP auto-detects (no
# PATH wrangling). Only jobs that actually build native code need this.
install_cmake: &install_cmake
  run:
    name: Install SDK CMake (bundles Ninja for native builds)
    # `yes` gets SIGPIPE (exit 141) once sdkmanager stops reading; under
    # CircleCI's `bash -eo pipefail` that would fail the step. `yes || true`
    # absorbs the signal so only sdkmanager's real exit status counts.
    command: (yes || true) | sdkmanager "cmake;3.22.1"

workflows:
  version: 2
  build_analyze:
    jobs:
      # kt-lint is self-contained (no Gradle / submodule) — run it in parallel
      # with setup rather than gating it behind setup.
      - kt-lint
      - setup
      - detekt:
          requires:
            - setup
      - android-lint:
          requires:
            - setup
      - screenshot-test:
          requires:
            - setup
      - build_release_apk:
          requires:
            - kt-lint
            - detekt
            - android-lint

##################################################

jobs:
  setup:
    resource_class: medium

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx3200m

    steps:
      - restore_cache:
          keys:
            - source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - run:
          name: Initialize submodules
          command: git submodule sync && git submodule update --init --recursive
      - run:
          name: Get all Git tags
          command: git fetch --prune --prune-tags && git fetch --tags -f
      - run:
          name: Fetch Paparazzi golden snapshots (Git LFS)
          # Done here because `setup` has SSH configured by `checkout`;
          # downstream jobs use attach_workspace and have no SSH set up.
          command: git lfs install --local && git lfs pull
      - restore_cache:
          keys:
            - jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum  "app/build.gradle.kts" }}
            - jars-v1-
      - run:
          name: Resolve dependencies
          # Dependency resolution only — no compilation, so no native build.
          # Populates ~/.gradle so downstream jobs resolve offline.
          command: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-configuration-cache --no-daemon --max-workers=2
      - save_cache:
          key: jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum  "app/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches/modules-2
            - ~/.gradle/wrapper
      - save_cache:
          key: source-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ".git"
            - "sage"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - project
            - .gradle/caches/modules-2
            - .gradle/wrapper

  kt-lint:
    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx2048m

    steps:
      # ktlint-check.sh downloads the ktlint binary and lints source directly;
      # it uses no Gradle, so the sage submodule and Gradle home aren't needed
      # (and skipping the submodule keeps vendored sage/ out of the lint set).
      - restore_cache:
          keys:
            - source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - run:
          name: Run Ktlint
          command: ./ktlint-check.sh
      - store_artifacts:
          path: ktlint.html
          destination: ktlint-reports

  detekt:
    resource_class: medium

    docker:
      - image: cimg/android:2024.04.1

    environment:
      JVM_OPTS: -Xmx3200m

    steps:
      - *attach_ws
      - restore_cache:
          keys:
            - build-cache-detekt-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-detekt-v1-{{ .Branch }}-
            - build-cache-detekt-v1-
      - run:
          name: Run Detekt checks
          # --continue so a failing module doesn't mask violations in others.
          command: ./gradlew detekt --continue --build-cache --configuration-cache --no-daemon --max-workers=2
      - save_cache:
          key: build-cache-detekt-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1

  android-lint:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      # Start off with a 4GB heap size; expand up to 6GB
      JVM_OPTS: -Xms4g -Xmx6g

    steps:
      - *attach_ws
      # lintRelease pulls dependency AARs, which builds the emulator native libs.
      - *install_cmake
      # Shared release build cache: lintRelease and assembleRelease compile the
      # same release graph. build_release_apk requires this job, so it restores
      # what we save here (its identical-key save is then a CircleCI no-op).
      - restore_cache:
          keys:
            - build-cache-release-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-release-v1-{{ .Branch }}-
            - build-cache-release-v1-
      - run:
          name: Run Android Lint checks
          command: ./gradlew :app:lintRelease --build-cache --configuration-cache --no-daemon --max-workers=4
      - save_cache:
          key: build-cache-release-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      - store_artifacts:
          path: app/build/reports/
          destination: reports

  screenshot-test:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      # Paparazzi LayoutLib rendering across the screenshot modules is
      # memory-hungry; the old -Xmx512m GC-thrashed on this `large` box.
      JVM_OPTS: -Xms2g -Xmx4g

    steps:
      # Golden snapshots come from the workspace (setup did the LFS pull;
      # this job has no SSH for git@github.com).
      - *attach_ws
      - restore_cache:
          keys:
            - build-cache-screenshot-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-screenshot-v1-{{ .Branch }}-
            - build-cache-screenshot-v1-
      - run:
          name: Compare screenshot tests
          command: ./gradlew verifyPaparazziDebug --build-cache --configuration-cache --no-daemon --max-workers=2
      - save_cache:
          key: build-cache-screenshot-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      - store_artifacts:
          path: features/search/screenshot/build/paparazzi/failures/
          destination: failure-screenshots/search
      - store_artifacts:
          path: features/artist-detail/screenshot/build/paparazzi/failures/
          destination: failure-screenshots/artist-detail
      - store_artifacts:
          path: features/game-detail/screenshot/build/paparazzi/failures/
          destination: failure-screenshots/game-detail

  build_release_apk:
    resource_class: large

    docker:
      - image: cimg/android:2024.04.1

    environment:
      # Start off with a 4GB heap size; expand up to 6GB
      JVM_OPTS: -Xms4g -Xmx6g

    steps:
      - *attach_ws
      # assembleRelease builds the emulator modules' native code via CMake.
      - *install_cmake
      # Shared with android-lint (runs first): restores its compiled release
      # graph so assembleRelease is largely cache hits.
      - restore_cache:
          keys:
            - build-cache-release-v1-{{ .Branch }}-{{ .Revision }}
            - build-cache-release-v1-{{ .Branch }}-
            - build-cache-release-v1-
      # Release signing reads CHIPBOX_KEY_ALIAS / CHIPBOX_KEYSTORE_PASSWORD /
      # CHIPBOX_KEY_PASSWORD from CircleCI project env vars (chipbox.jks is
      # committed at the repo root). Without them the APK is debug-signed.
      - run:
          name: Build Release
          command: ./gradlew :app:assembleRelease -PdisablePreDex --build-cache --configuration-cache --no-daemon --max-workers=4
      - save_cache:
          key: build-cache-release-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches/build-cache-1
      - store_artifacts:
          path: app/build/outputs/apk/release
          destination: outputs
