version: 2.1

# `setup` is a real setup step — it checks out, inits the `sage` submodule,
# fetches tags, and resolves dependencies once, then a workspace carries the
# repo (incl. `sage` and `.git`) and the resolved Gradle dependency cache to
# every downstream job. Downstream jobs attach the workspace instead of
# re-cloning / re-resolving. They compile only what they need; native code is
# built only in the jobs that actually require it.
#
# Compiled task outputs are shared via the self-hosted remote Gradle build cache
# (gradle.sebacloud.org, configured in settings.gradle.kts): every job pulls
# matching entries and CI pushes new ones, so the expensive Kotlin compiles
# happen once and are reused across jobs, branches, and developer machines.
# CircleCI's own caches now cover only what the build cache doesn't: the source
# checkout (.git + sage) and resolved dependency downloads (modules-2).

parameters:
  # Workspace root is the home dir so both `project` and `.gradle` fit under it.
  # A pipeline parameter keeps this single-sourced for the executor, the
  # attach-workspace command, and setup's persist_to_workspace.
  workspace_root:
    type: string
    default: /home/circleci

##################################################

executors:
  # Every job runs on the same cimg/android image and differs only in box size
  # and heap tuning, so one parameterized executor covers them all.
  android:
    parameters:
      resource_class:
        type: enum
        enum: ["medium", "large"]
        default: "medium"
      jvm_opts:
        type: string
        default: -Xmx3200m
    resource_class: << parameters.resource_class >>
    docker:
      - image: cimg/android:2024.04.1
    environment:
      JVM_OPTS: << parameters.jvm_opts >>

##################################################

commands:
  # Downstream jobs attach the workspace setup produced instead of re-cloning /
  # re-resolving. The matching persist_to_workspace lives in `setup`.
  attach_built_workspace:
    steps:
      - attach_workspace:
          at: << pipeline.parameters.workspace_root >>

  # The emulator modules build native code via CMake, which needs Ninja. The
  # cimg/android image ships neither an SDK CMake nor Ninja; installing the SDK
  # CMake package bundles Ninja in its bin folder, which AGP auto-detects (no
  # PATH wrangling). Only jobs that actually build native code need this.
  install_cmake:
    steps:
      - run:
          name: Install SDK CMake (bundles Ninja for native builds)
          # `yes` gets SIGPIPE (exit 141) once sdkmanager stops reading; under
          # CircleCI's `bash -eo pipefail` that would fail the step. `yes || true`
          # absorbs the signal so only sdkmanager's real exit status counts.
          command: (yes || true) | sdkmanager "cmake;3.22.1"

  # The emulator :native modules build their .so's with our own buildEmulatorNativeLib task
  # (CMake + the NDK toolchain), NOT AGP's externalNativeBuild. AGP only auto-installs the NDK
  # when *its own* native tasks need it — which we no longer have — so setting ndkVersion alone
  # doesn't download it. Install it explicitly here so the toolchain file exists before any
  # native task runs (otherwise: "Could not find toolchain file"). Only build-release-apk builds
  # the Android .so's, so only it needs this. Version pinned to NativeEmulators.NDK_VERSION.
  install_ndk:
    steps:
      - run:
          name: Install NDK (toolchain for the Android emulator native libs)
          command: (yes || true) | sdkmanager "ndk;29.0.14206865"

  # The JVM target's emulator libs are host-built (host CMake's default Unix
  # Makefiles generator + gcc/g++/make/ar), NOT via the NDK. apps/jvm's build
  # script runs the CMake configure/build Exec tasks during installDist; they
  # resolve the `cmake` binary through $ANDROID_HOME (the SDK 3.22.1 that
  # install_cmake drops in — same version AGP uses), but the compile itself needs
  # a host C/C++ toolchain that the cimg/android image doesn't guarantee. Only
  # build-release-jvm builds host-native code, so only it needs this.
  install_host_toolchain:
    steps:
      - run:
          name: Install host C/C++ toolchain (gcc/g++/make for JVM native libs)
          command: sudo apt-get update && sudo apt-get install -y build-essential

  # CMake and the NDK are large SDK packages the release jobs re-provision every run (install_cmake
  # downloads CMake; AGP auto-installs the NDK from `ndkVersion`). The native *build* is cacheable
  # now, but the *tools* aren't — so cache the SDK package dirs across runs. The key is the checksum
  # of NativeEmulators.kt (where the CMake/NDK versions live), so a version bump auto-busts it and no
  # fallback key can restore a stale version. On a hit, "installing" becomes a fast restore instead
  # of a download (the NDK is ~1 GB). `package` is the SDK dir name: "cmake" or "ndk".
  #
  # NOTE: CircleCI does NOT expand environment variables in cache `paths`. A `$ANDROID_HOME/cmake`
  # entry resolved to the literal `/home/circleci/project/$ANDROID_HOME/cmake`, found nothing, and
  # archived an empty 16-byte cache — so installs silently re-downloaded every run. The SDK lives at
  # /home/circleci/android-sdk (a real image-level ENV on cimg/android), so the path is hardcoded.
  # Key bumped to `-v2-` because the broken `-v1-` empty archives are immutable under their key and
  # would otherwise never be replaced (a restore would hit the empty cache and the save would no-op).
  restore_sdk_package:
    parameters:
      package:
        type: string
    steps:
      - restore_cache:
          keys:
            - sdk-<< parameters.package >>-v2-{{ checksum "build-logic/convention/src/main/kotlin/NativeEmulators.kt" }}
  save_sdk_package:
    parameters:
      package:
        type: string
    steps:
      - save_cache:
          key: sdk-<< parameters.package >>-v2-{{ checksum "build-logic/convention/src/main/kotlin/NativeEmulators.kt" }}
          paths:
            - /home/circleci/android-sdk/<< parameters.package >>

  # Gradle's configuration cache lives in the project-local `.gradle/configuration-cache`
  # (one entry per distinct task-graph request). CI containers are throwaway, so without
  # this every downstream job re-runs the full ~2-minute configuration — model configuration
  # across 156 modules dominates it — on every build; a scan shows it as "Configuration
  # caching: MISS — no cached configuration was available". The entries are portable across
  # runs here: every job uses the same cimg/android image at the same `project` path, so the
  # absolute paths Gradle bakes in stay valid.
  #
  # Persist it per `job` — each job requests a different task graph, hence a different entry —
  # with a branch/revision fallback chain. The exact `{{ .Revision }}` key hits on a rerun of
  # the same commit; the `{{ .Branch }}-` fallback restores the previous commit's entry, which
  # Gradle reuses as long as no *configuration input* changed (build scripts, the version
  # catalogs, gradle.properties, env vars read during configuration). Editing only `src/**`
  # Kotlin leaves the entry valid → HIT. On any real input change Gradle revalidates the
  # fingerprint and re-configures from scratch, so a stale restore is never wrong, only
  # occasionally wasted. `setup` is excluded on purpose — it resolves dependencies with
  # `--no-configuration-cache`, so it never writes an entry.
  restore_config_cache:
    parameters:
      job:
        type: string
    steps:
      - restore_cache:
          keys:
            - cconfig-<< parameters.job >>-v1-{{ .Branch }}-{{ .Revision }}
            - cconfig-<< parameters.job >>-v1-{{ .Branch }}-
            - cconfig-<< parameters.job >>-v1-
  save_config_cache:
    parameters:
      job:
        type: string
    steps:
      - save_cache:
          # `when: always` so a job that fails in task *execution* still saves the entry that
          # *configuration* already produced (Gradle writes the config-cache entry once
          # configuration succeeds, before any task runs) — a retry of the same commit then
          # skips configuration entirely. The `{{ .Revision }}` key is immutable, so a rerun
          # after a successful save is a no-op.
          when: always
          key: cconfig-<< parameters.job >>-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - .gradle/configuration-cache

  # Sweep every module's `build/reports/` (ktlint, detekt, html test reports, lint,
  # whatever lives there) into one tree keyed by module path. Runs `when: always`
  # so a failing check still ships its report. `./sage` is the vendored submodule
  # (its own included build) — its reports come from a separate build invocation,
  # don't collect them. The matched dir is `-prune`d so find doesn't descend back
  # into it; the cp -r grabs the whole tree.
  collect_reports:
    steps:
      - run:
          name: Collect build/reports from every module
          when: always
          command: |
            mkdir -p ~/reports
            find . -path './sage' -prune -o \
                   -path '*/build/reports' -type d -print -prune | while read d; do
              mod=$(echo "$d" | sed 's|^\./||;s|/build/reports$||;s|/|-|g')
              mkdir -p ~/reports/"$mod" && cp -r "$d"/. ~/reports/"$mod"/
            done

  # Sweep every module's JUnit-format `TEST-*.xml` into one tree CircleCI can
  # parse into the Tests tab. Per-module subdir so each suite shows up
  # separately. Same `when: always` + sage-exclusion rationale as collect_reports.
  collect_test_results:
    steps:
      - run:
          name: Collect JUnit XML test results from every module
          when: always
          command: |
            mkdir -p ~/test-results
            find . -path './sage' -prune -o \
                   -path '*/build/test-results/*' -name 'TEST-*.xml' -print | while read f; do
              mod=$(echo "$f" | sed 's|^\./||;s|/build/test-results/.*$||;s|/|-|g')
              mkdir -p ~/test-results/"$mod" && cp "$f" ~/test-results/"$mod"/
            done

  # Paparazzi's failure / diff images live under `build/paparazzi/`, NOT under
  # `build/reports/`, so collect_reports misses them. Each screenshot module
  # gets its own subdir in the artifact tree so a regression is one click away.
  collect_paparazzi:
    steps:
      - run:
          name: Collect Paparazzi failure / diff images from every screenshot module
          when: always
          command: |
            mkdir -p ~/paparazzi
            find . -path './sage' -prune -o \
                   -path '*/build/paparazzi' -type d -print -prune | while read d; do
              mod=$(echo "$d" | sed 's|^\./||;s|/build/paparazzi$||;s|/|-|g')
              mkdir -p ~/paparazzi/"$mod" && cp -r "$d"/. ~/paparazzi/"$mod"/
            done

##################################################

workflows:
  build_analyze:
    jobs:
      - setup
      # ktlint + detekt share ONE Gradle configuration in a single job rather than paying the
      # (dominant) configuration cost twice; -Pchipbox.skipNative keeps the emulator modules'
      # CMake/NDK toolchain out of configuration here. Needs the workspace setup produces.
      - static-analysis:
          requires:
            - setup
      - screenshot-test:
          requires:
            - setup
      # commonTest unit tests for the chipbox.kmp.test modules — runs the JVM
      # target of every commonTest source set (ViewModel tests, repository
      # tests, etc.). Gates behind static-analysis so a syntax error fails fast on
      # `medium` rather than burning compile time here.
      #
      # Sibling jsTest run isn't wired into CI by choice: the matching JVM run
      # below covers the same suites end-to-end, and the JS toolchain adds
      # cold-cache wall-clock (yarn install + Kotlin/JS compile) without a
      # proportional regression-catching payoff today. `./gradlew jsTest`
      # remains available locally.
      - unit-test-jvm:
          requires:
            - static-analysis
            - setup
      # shared-build compiles the JVM target of every module shared between the
      # JVM and Android apps. It gates behind static-analysis as a cheap fail-fast
      # check (ktlint + detekt) before the heavy compile; setup supplies the workspace.
      - shared-build:
          requires:
            - static-analysis
            - setup
      # Heavy Android jobs start only once the shared code compiles — and since
      # shared-build itself gates on static-analysis, a `large` box is never spent on
      # lint / APK assembly for code that failed ktlint/detekt or the shared compile.
      - android-lint:
          requires:
            - shared-build
      # build-release-jvm finishes the JVM app: the shared Kotlin compiles are
      # remote-cache hits (shared-build pushed them), so it only adds the
      # host-native libs + the desktop distribution on top.
      - build-release-jvm:
          requires:
            - shared-build
      - build-release-apk:
          requires:
            - android-lint

##################################################

jobs:
  setup:
    executor: android

    steps:
      - restore_cache:
          keys:
            - source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - run:
          name: Initialize submodules
          # `submodule sync` realigns each submodule's recorded URL with whatever .gitmodules
          # currently declares — guards against URL drift on a restored cached `.git`. The
          # explicit `foreach … fetch origin` then pulls every ref tip from each submodule's
          # remote before `submodule update` tries to check out the target SHA. Without that
          # foreach, a SHA pushed after the cache was last saved surfaces as a fetch-by-SHA
          # in `submodule update` and GitHub refuses it with `upload-pack: not our ref`
          # (sage's main moved without the cached submodule clone knowing). With the foreach,
          # the SHA arrives via a normal `refs/heads/*` fetch and the checkout finds it
          # locally. `|| true` on the foreach so a brand-new fresh-clone setup (where there's
          # no submodule clone yet to fetch into) doesn't fail the step.
          command: |
            git submodule sync
            git submodule foreach --recursive 'git fetch origin' || true
            git submodule update --init --recursive
      - run:
          name: Get all Git tags
          command: git fetch --prune --prune-tags && git fetch --tags -f
      - run:
          name: Fetch Paparazzi golden snapshots (Git LFS)
          # Done here because `setup` has SSH configured by `checkout`;
          # downstream jobs use attach_workspace and have no SSH set up.
          command: git lfs install --local && git lfs pull
      # Key on every file that can change the resolved dependency set: the root
      # and both app build scripts, plus the version catalog. The JVM app pulls
      # deps the Android release graph doesn't (Compose Desktop + Skia, Voyager,
      # sqlite-bundled, metrox), so a JVM-only bump must bust this cache too.
      - restore_cache:
          keys:
            - jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum "apps/android/build.gradle.kts" }}-{{ checksum "apps/jvm/build.gradle.kts" }}-{{ checksum "sage/gradle/libs.versions.toml" }}
            - jars-v1-
      - run:
          name: Resolve app dependencies (Android + JVM)
          # Dependency resolution only — no compilation, so no native build. One Gradle invocation
          # warms BOTH apps' classpaths into ~/.gradle so downstream jobs resolve offline, paying the
          # (dominant) build configuration once instead of twice. The JVM/desktop deps aren't in the
          # Android release classpath (Compose Desktop + Skia, Voyager, sqlite-bundled, metrox), so both
          # must be resolved here — otherwise shared-build AND build-release-jvm each re-download the
          # JVM-only delta (different boxes, neither persists modules-2). The two `:apps:*:dependencies`
          # report tasks can't share one invocation (each needs a different `--configuration`), so each
          # app instead registers a `resolveCiDependencies` task that resolves its own dependency graph;
          # the unqualified task name runs both in this single invocation. `--no-build-cache`: no
          # cacheable compile work here worth pushing to the remote cache, so skip the cache machinery.
          command: ./gradlew resolveCiDependencies --no-configuration-cache --no-build-cache --no-daemon --max-workers=2
      - save_cache:
          key: jars-v1-{{ checksum "build.gradle.kts" }}-{{ checksum "apps/android/build.gradle.kts" }}-{{ checksum "apps/jvm/build.gradle.kts" }}-{{ checksum "sage/gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle/caches/modules-2
            - ~/.gradle/wrapper
      - save_cache:
          key: source-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ".git"
            - "sage"
      - persist_to_workspace:
          root: << pipeline.parameters.workspace_root >>
          paths:
            - project
            - .gradle/caches/modules-2
            - .gradle/wrapper

  static-analysis:
    executor: android

    steps:
      - attach_built_workspace
      - restore_config_cache:
          job: static-analysis
      - run:
          name: Run Ktlint + Detekt
          # Both static-analysis checks in ONE Gradle invocation so the (dominant) configuration
          # cost is paid once instead of twice. --continue so a ktlint failure doesn't mask detekt
          # violations and vice versa. -Pchipbox.skipNative skips the emulator :native modules'
          # CMake/NDK toolchain resolution at configuration time (~20s) — they have no Kotlin to
          # lint, so there's nothing for this job to do in them. ktlint runs through Gradle
          # (org.jlleitschuh.gradle.ktlint); the vendored sage/ submodule is a separate included
          # build and stays out of the lint set.
          command: ./gradlew ktlintCheck detekt --continue --build-cache --configuration-cache --no-daemon --max-workers=2 -Pchipbox.skipNative
      - save_config_cache:
          job: static-analysis
      - collect_reports
      - store_artifacts:
          path: ~/reports
          destination: static-analysis-reports
          when: always

  shared-build:
    # A whole-graph Kotlin compile of every shared module — give it the headroom
    # the `large` Android jobs get rather than throttling it on `medium`.
    executor:
      name: android
      resource_class: large
      jvm_opts: -Xms2g -Xmx4g

    steps:
      - attach_built_workspace
      - restore_config_cache:
          job: shared-build
      - run:
          name: Build shared JVM/Android code
          # `:apps:jvm:classes` compiles apps/jvm plus, transitively, the JVM
          # target of every module it depends on — the 55 sage.kmp shared modules
          # and the pure-JVM sage.jvm modules: as much jvm/android-shared code as
          # can be built in one target. It stops at compilation: native libs and
          # the distribution are only wired into run/installDist/dist*, so neither
          # is triggered here — build-release-jvm adds those. (Pure-JVM modules
          # have no debug/release split; the Android `release` graph is compiled
          # in android-lint, which feeds build-release-apk.) Outputs are pushed to
          # the remote build cache, so build-release-jvm hits them.
          command: ./gradlew :apps:jvm:classes --build-cache --configuration-cache --no-daemon --max-workers=4
      - save_config_cache:
          job: shared-build

  android-lint:
    executor:
      name: android
      resource_class: large
      # Start off with a 4GB heap size; expand up to 6GB
      jvm_opts: -Xms4g -Xmx6g

    steps:
      - attach_built_workspace
      - restore_config_cache:
          job: android-lint
      - run:
          name: Run Android Lint checks
          # lintRelease and assembleRelease compile the same release graph; those Kotlin compiles
          # land in the remote build cache here, so build-release-apk hits them. -Pchipbox.skipNative
          # skips the emulator CMake/NDK build: AGP's externalNativeBuild tasks aren't cacheable and
          # lint analyzes code (not the .so libs), so building native here is pure duplicated cost —
          # build-release-apk is the one job that actually needs the native libs. (No CMake install
          # needed as a result.)
          command: ./gradlew :apps:android:lintRelease --build-cache --configuration-cache --no-daemon --max-workers=4 -Pchipbox.skipNative
      - save_config_cache:
          job: android-lint
      # Existing apps/android/build/reports/ kept verbatim so its CircleCI URL
      # stays stable for anyone with a bookmark; the broader collect_reports
      # below picks up any other module that produced reports during lintRelease
      # (e.g. transitive android-resource validation reports).
      - store_artifacts:
          path: apps/android/build/reports/
          destination: reports
          when: always
      - collect_reports
      - store_artifacts:
          path: ~/reports
          destination: lint-reports
          when: always

  unit-test-jvm:
    executor:
      name: android
      resource_class: large
      jvm_opts: -Xms2g -Xmx4g

    steps:
      - attach_built_workspace
      - restore_config_cache:
          job: unit-test
      - run:
          name: Run JVM unit tests (commonTest @ jvmTest)
          command: ./gradlew jvmTest --continue --build-cache --configuration-cache --no-daemon --max-workers=2
      - save_config_cache:
          job: unit-test
      # JUnit XMLs for the CircleCI Tests tab (pass/fail counts, suite drilldown).
      - collect_test_results
      - store_test_results:
          path: ~/test-results
          when: always
      # HTML test reports + any other build/reports/ output for download.
      - collect_reports
      - store_artifacts:
          path: ~/reports
          destination: jvm-test-reports
          when: always

  screenshot-test:
    executor:
      name: android
      resource_class: large
      # Paparazzi LayoutLib rendering across the screenshot modules is
      # memory-hungry; the old -Xmx512m GC-thrashed on this `large` box.
      jvm_opts: -Xms2g -Xmx4g

    steps:
      # Golden snapshots come from the workspace (setup did the LFS pull;
      # this job has no SSH for git@github.com).
      - attach_built_workspace
      - restore_config_cache:
          job: screenshot
      - run:
          name: Compare screenshot tests
          command: ./gradlew verifyPaparazziDebug --continue --build-cache --configuration-cache --no-daemon --max-workers=2
      - save_config_cache:
          job: screenshot
      # JUnit XML for the Tests tab (Paparazzi runs as a JUnit test under the hood).
      - collect_test_results
      - store_test_results:
          path: ~/test-results
          when: always
      # Build-reports (html test reports, lint, etc) and the paparazzi failure
      # images themselves — different roots, different collectors.
      - collect_reports
      - store_artifacts:
          path: ~/reports
          destination: screenshot-reports
          when: always
      - collect_paparazzi
      - store_artifacts:
          path: ~/paparazzi
          destination: paparazzi-images
          when: always

  build-release-apk:
    executor:
      name: android
      resource_class: large
      # Start off with a 4GB heap size; expand up to 6GB
      jvm_opts: -Xms4g -Xmx6g

    steps:
      - attach_built_workspace
      - restore_config_cache:
          job: release-apk
      # Restore the SDK CMake + NDK before provisioning them, so install_cmake and AGP's NDK
      # auto-install become fast cache restores instead of downloads (the NDK is ~1 GB).
      - restore_sdk_package:
          package: cmake
      - restore_sdk_package:
          package: ndk
      # assembleRelease builds the emulator modules' native code via CMake + the NDK toolchain.
      # On a cache hit these are no-ops (the packages are already on disk); otherwise they download.
      - install_cmake
      - install_ndk
      # Release signing reads CHIPBOX_KEY_ALIAS / CHIPBOX_KEYSTORE_PASSWORD /
      # CHIPBOX_KEY_PASSWORD from CircleCI project env vars (chipbox.jks is
      # committed at the repo root). Without them the APK is debug-signed.
      - run:
          name: Build Release
          # The release-graph compiles are remote-cache hits from android-lint; this job
          # adds the assemble-only work (dexing, resource/APK packaging, native build).
          command: ./gradlew :apps:android:assembleRelease -PdisablePreDex --build-cache --configuration-cache --no-daemon --max-workers=4
      # Rename the APK to chipbox-<versionName>.apk so the published artifact carries the
      # git-tag-derived version (apps/android/build.gradle.kts appVersioning {}). Reads the name from
      # the version_name.txt the plugin generates during assembleRelease — see the script for why
      # that, not output-metadata.json, is the source of truth.
      - run:
          name: Name release APK by version
          command: ./scripts/rename-release-apk.sh
      - save_config_cache:
          job: release-apk
      # Repopulate the tool caches — AGP installed the NDK during the build above.
      - save_sdk_package:
          package: cmake
      - save_sdk_package:
          package: ndk
      - store_artifacts:
          path: apps/android/build/outputs/apk/release
          destination: outputs
          when: always
      # Report sweep so any module-level build-time report from the release
      # graph (e.g. resource shrinker, R8 mapping reports) is downloadable.
      - collect_reports
      - store_artifacts:
          path: ~/reports
          destination: release-apk-reports
          when: always

  build-release-jvm:
    executor:
      name: android
      resource_class: large
      jvm_opts: -Xms2g -Xmx4g

    steps:
      - attach_built_workspace
      - restore_config_cache:
          job: release-jvm
      # installDist host-builds the 7 emulator native libs (host CMake + gcc/g++)
      # and bundles them into the distribution. cmake comes from the SDK package;
      # the host C/C++ toolchain from apt. No NDK here — the host build targets the
      # build machine, not Android.
      - restore_sdk_package:
          package: cmake
      - install_cmake
      - install_host_toolchain
      - run:
          name: Build Release (JVM desktop app)
          # Every Kotlin compile is a remote-cache hit (shared-build pushed them),
          # so this job's real work is just the host native build + the distribution.
          command: ./gradlew :apps:jvm:installDist --build-cache --configuration-cache --no-daemon --max-workers=4
      - save_config_cache:
          job: release-jvm
      - save_sdk_package:
          package: cmake
      - store_artifacts:
          path: apps/jvm/build/install
          destination: jvm-dist
          when: always
      - collect_reports
      - store_artifacts:
          path: ~/reports
          destination: release-jvm-reports
          when: always
