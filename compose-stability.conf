// Stability rules specific to chipbox types.
// SAGE-defined types are declared in sage/compose-stability.conf and pulled in
// automatically by sage-build-logic's AndroidCompose plugin — see that file.

// Action hierarchy: the chipbox-side open-class root that screen actions
// extend (LibraryAction, BrowseByGameAction, ...). Concrete subtypes are
// data class / data object.
net.sigmabeta.chipbox.appcomm.ChipboxAction

// Chipbox-side ListModel wrappers/items rendered through ComposableMapping
// (DraggableListModel, DismissibleListModel, NowPlayingHomeCardListModel, ...).
// These are immutable data classes whose equals fully describes observable
// state, but they infer unstable because they wrap the open `ListModel` base —
// the same reason sage wildcards net.sigmabeta.sage.components.*. Wildcarding
// the package keeps them compared by equals (not instance identity) and also
// covers any new wrapper added here later.
net.sigmabeta.chipbox.common.ui.components.api.*
