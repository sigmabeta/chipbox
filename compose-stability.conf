// Classes treated as @Stable by the Compose compiler.
// Entries are FQNs; `*` matches one segment, `**` matches subpackages.
// Pattern mirrored from vgls-android/compose-stability.conf.

// Action hierarchy: open class roots whose subtypes are all data class /
// data object. Concrete actions are immutable.
net.sigmabeta.sage.appcomm.SageAction
net.sigmabeta.chipbox.appcomm.ChipboxAction

// Action sink: a fun interface. ViewModels implement it; their identity is
// stable across recompositions (hiltViewModel() returns the same instance).
net.sigmabeta.sage.appcomm.ActionSink

// List item models: data classes that the compiler infers as unstable
// transitively (open-class fields, Throwable, etc.). Wildcarding the package
// also covers any *ListModel added later.
net.sigmabeta.sage.components.*

// Rendered list state — what ChipboxListEntry / ListScreen / GridScreen
// collect each frame.
net.sigmabeta.sage.list.ListStateActual

// String resolver passed into ListState.toActual; identity is stable.
net.sigmabeta.sage.ui.StringProvider

// Wrapper used by CrossfadeImage. Immutable, but allocated fresh per
// composition in SquareItem; marking it stable lets equality-based skip work.
net.sigmabeta.sage.images.SourceInfo

// stdlib types that appear in stable data classes (notably LCE.Error.error).
// Marking Throwable stable cascades: LCE.Error -> LCE<T> -> any state holding
// an LCE field (e.g. BrowseByGameState) becomes stable, unlocking skip on
// list-screen composables.
kotlin.Throwable
