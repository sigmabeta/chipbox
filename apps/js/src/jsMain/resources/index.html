<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Deep links (e.g. /game/42) are served this same index.html by the server's SPA fallback.
         Without an absolute base, the browser resolves the relative favicon/splash/script URLs
         under the current path (/game/favicon.png), so a refresh on a detail screen loads a blank
         page. `base` keeps every asset at the site root for both / and nested app routes. -->
    <base href="/">
    <title>Chipbox</title>
    <!-- The web client is a release-shaped build (AppInfo.isDebug = false, WebModules.kt): the
         favicon and launch splash use the release artwork, matching the in-app palette and the
         desktop release assets. There is no debug splash on web. -->
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        /* Launch splash shown until the wasm/Skia bundle loads and JsMain removes #splash. Mirrors
           Android's androidx splash: centered launcher icon on the Chipbox background. CSS makes it
           night-aware (the desktop AWT splash can't) using the same backgroundLight/backgroundDark
           hexes as ChipboxLight/Dark. */
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #FFF8F1; }
        #splash {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #FFF8F1;
        }
        #splash img { width: 144px; height: 144px; image-rendering: pixelated; }
        @media (prefers-color-scheme: dark) {
            html, body, #splash { background: #16130B; }
        }
    </style>
</head>
<body>
<div id="splash"><img src="splash.png" alt="Chipbox"></div>
<script src="chipbox.js"></script>
</body>
</html>
